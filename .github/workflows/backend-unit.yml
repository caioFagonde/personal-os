name: backend-unit

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  api-gateway-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Unit tests with coverage
        run: |
          pytest tests -q \
            --cov=app.security \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-api-gateway.xml \
            --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api-gateway
          path: services/api-gateway/coverage-api-gateway.xml

  sync-engine-conflict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sync-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Unit tests with coverage
        run: |
          pytest tests -q \
            --cov=app.conflict \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-sync-engine.xml \
            --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-sync-engine
          path: services/sync-engine/coverage-sync-engine.xml

  command-bus-signing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/command-bus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Unit tests with coverage
        run: |
          pytest tests -q \
            --cov=app.signing \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-command-bus.xml \
            --cov-fail-under=100
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-command-bus
          path: services/command-bus/coverage-command-bus.xml
