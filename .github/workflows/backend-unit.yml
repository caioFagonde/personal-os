name: Backend Unit

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  root-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio anyio pyyaml fastapi pydantic httpx asyncpg cryptography pyjwt
      - name: Run root contract and scaffold tests
        run: |
          python -m pytest tests/ --ignore=tests/live -q

  service-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - sync-engine
          - command-bus
          - module-service
          - capture-service
          - research-service
          - automation-service
          - connector-service
          - digital-twin-service
          - study-companion-service
          - model-runtime
          - coding-agent-service
          - intelligence-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: |
          pip install pytest pytest-asyncio anyio
          if [ -f "services/${{ matrix.service }}/requirements.txt" ]; then
            pip install -r "services/${{ matrix.service }}/requirements.txt"
          fi
      - name: Run service tests
        run: |
          if [ -d "services/${{ matrix.service }}/tests" ]; then
            cd "services/${{ matrix.service }}" && python -m pytest tests -q
          else
            echo "no tests directory for ${{ matrix.service }} — failing honestly"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check services

  secret-and-pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local secret and personal-data scan
        run: bash scripts/check-secrets.sh
