name: phase12-certification-release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_live_connectors:
        description: Run live connector sandbox tests when secrets are configured
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build web SPA
        run: pnpm --dir apps/web build
      - name: Serve SPA
        run: |
          python3 scripts/ci/spa-server.py --root apps/web/dist/spa --host 127.0.0.1 --port 9000 > /tmp/personal-os-spa.log 2>&1 &
          echo $! > /tmp/personal-os-spa.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:9000 >/dev/null && exit 0; sleep 1; done
          cat /tmp/personal-os-spa.log
          exit 1
      - name: Run Playwright E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:9000
        run: pnpm exec playwright test --project=desktop-chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  android-emulator-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Prepare mobile project
        run: |
          pnpm --dir apps/mobile validate
          pnpm --dir apps/mobile cap:add:android
          pnpm --dir apps/mobile cap:sync
      - name: Build debug APK
        run: cd apps/mobile/android && ./gradlew assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb reverse tcp:8080 tcp:8080 || true
            APK=$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
            adb install -r "$APK"
            adb shell am start -n io.personalos.mobile/.MainActivity || true
            adb shell pm list packages | grep -q io.personalos.mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk-phase12
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  optional-live-connector-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_connectors == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test deps
        run: python -m pip install -U pytest
      - name: Run live connector tests
        env:
          RUN_LIVE_CONNECTOR_TESTS: "true"
          TWILIO_LIVE_SEND: ${{ secrets.TWILIO_LIVE_SEND || 'false' }}
          PERSONAL_OS_BASE_URL: ${{ secrets.PERSONAL_OS_BASE_URL }}
        run: python -m pytest tests/live -q -m live

  restore-drill-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare env
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
      - name: Run restore drill
        run: ./scripts/restore-drill.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-drill-artifacts
          path: |
            backups
            logs
          if-no-files-found: ignore

  signed-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install Tauri Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build Android artifact
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/release/build-android-signed.sh
      - name: Build Tauri artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release/build-tauri-signed.sh
      - name: Verify artifacts
        run: ./scripts/release/verify-release-artifacts.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: personal-os-release-artifacts-phase12
          path: artifacts/release
          if-no-files-found: ignore

  scaffold-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pytest PyYAML
      - run: python -m pytest tests/test_phase12_scaffold.py -q
