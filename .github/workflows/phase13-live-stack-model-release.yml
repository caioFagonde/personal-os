name: Phase 13 Live Stack, Model Runtime, Release Publishing

on:
  push:
    paths:
      - 'services/model-runtime/**'
      - 'e2e/live-stack.spec.ts'
      - 'scripts/certify/**'
      - 'scripts/release/**'
      - '.github/workflows/phase13-live-stack-model-release.yml'
      - 'docker-compose.yml'
      - 'apps/web/**'
      - 'tests/test_phase13_scaffold.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUBLISH_RELEASE_DRY_RUN: true

jobs:
  model-runtime-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/model-runtime/requirements.txt pytest pytest-cov
      - name: Unit tests with coverage
        working-directory: services/model-runtime
        run: python -m pytest tests -q --cov=app.runtime --cov-branch --cov-fail-under=96

  scaffold-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase 13 scaffold tests
        run: python -m pytest tests/test_phase13_scaffold.py -q
      - name: Readiness script
        run: python scripts/certify/release-readiness.py

  live-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare env
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
      - name: Run live stack E2E
        run: ./scripts/certify/live-stack-e2e.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env --profile core --profile apps --profile automation --profile research --profile ai --profile connectors logs --tail=200 || true
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env --profile core --profile apps --profile automation --profile research --profile ai --profile connectors down -v || true

  android-physical-script-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/certify/physical-sync.sh
      - name: Ensure adb wait handoff exists
        run: grep -q 'Waiting for USB Android authorization' scripts/certify/physical-sync.sh

  release-publish-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry-run publish script
        run: ./scripts/release/publish-github-release.sh
      - name: Verify publishing script is not using secrets in source
        run: ./scripts/check-secrets.sh
