name: Phase 13 Live Stack Model Release

on:
  push:
    branches: [main]
    paths:
      - 'services/model-runtime/**'
      - 'e2e/live-stack.spec.ts'
      - 'tests/test_phase13_scaffold.py'
  pull_request:
    paths:
      - 'services/model-runtime/**'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  model-runtime-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install -r services/model-runtime/requirements.txt
      - name: Model runtime tests with coverage
        run: cd services/model-runtime && python -m pytest tests -q --cov=app --cov-report=term-missing
      - name: Phase 13 scaffold contract
        run: python -m pytest tests/test_phase13_scaffold.py -q

  live-stack-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Bring up stack and run live-stack spec
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
          docker compose up -d postgres nats minio api-gateway sync-engine command-bus module-service model-runtime web
          sleep 25
          pnpm exec playwright test e2e/live-stack.spec.ts
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=100
