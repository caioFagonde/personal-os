name: Phase 11 Production Continuity

on:
  push:
    paths:
      - 'services/connector-service/**'
      - 'apps/web/src/pages/*WorkerPage.vue'
      - 'apps/web/src/pages/*QueuePage.vue'
      - 'apps/web/src/pages/*Conflict*.vue'
      - 'infra/postgres/migrations/010_phase_11_connector_worker_ui.sql'
      - 'scripts/restore-drill.sh'
      - '.github/workflows/phase11-production-continuity.yml'
  pull_request:

jobs:
  connector-worker-coverage:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/connector-service/requirements.txt pytest pytest-cov
      - name: Unit tests with coverage
        run: |
          cd services/connector-service
          PYTHONPATH=. python -m pytest tests -q --cov=app.providers --cov=app.backup --cov=app.oauth --cov-branch --cov-fail-under=96

  scaffold-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - run: python -m pytest tests/test_phase11_scaffold.py -q

  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
      - name: Run restore drill
        run: ./scripts/restore-drill.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env logs --tail=200 || true
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env down -v || true

  web-interface-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile=false
      - run: |
          grep -q '/connector-worker' apps/web/src/router/routes.ts
          grep -q '/offline-queue' apps/web/src/router/routes.ts
          grep -q '/conflicts' apps/web/src/router/routes.ts
          pnpm --dir apps/web test -- --run
