name: desktop-tauri

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  tauri-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Validate Tauri config
        run: pnpm --dir apps/desktop validate
      - name: Rust format check
        run: pnpm --dir apps/desktop format
      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Build desktop bundle
        run: pnpm --dir apps/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: personal-os-linux-desktop
          path: apps/desktop/src-tauri/target/release/bundle
