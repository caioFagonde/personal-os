name: Phase 7 Production UX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  service-identity-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest pytest-asyncio -r services/api-gateway/requirements.txt
      - name: Gateway identity and observability tests
        run: cd services/api-gateway && python -m pytest tests -q

  design-system-and-web-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Design system tests
        run: pnpm --dir packages/design-system test
      - name: Web unit tests
        run: pnpm --dir apps/web test

  mobile-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Capacitor config validation
        run: node apps/mobile/scripts/validate-capacitor-config.mjs
      - name: Mobile runtime policy tests
        run: pnpm --dir apps/mobile test

  desktop-native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tauri config validation
        run: node apps/desktop/scripts/validate-tauri-config.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust check
        run: cd apps/desktop/src-tauri && cargo check --locked || cargo check

  observability-compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest pyyaml
      - name: Compose and observability contracts
        run: python -m pytest tests/test_phase7_scaffold.py tests/test_phase13_7_grafana_mount_regression.py tests/test_phase13_8_grafana_volume_yaml_regression.py -q
