name: phase7-production-ux

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service-identity-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API gateway dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api-gateway/requirements.txt pytest pytest-cov
      - name: Run Phase 7 backend coverage gates
        run: |
          cd services/api-gateway
          python -m PYTHONPATH=. pytest tests/test_service_identity.py tests/test_observability.py tests/test_release.py -q \
            --cov=app.service_identity --cov=app.observability --cov=app.release --cov-branch --cov-fail-under=96

  design-system-and-web-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile=false
      - name: Test web UX logic and design tokens
        run: |
          pnpm --dir packages/design-system test
          pnpm --dir apps/web test -- --coverage

  mobile-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile=false
      - name: Validate mobile shell policy
        run: |
          pnpm --dir apps/mobile preflight
          pnpm --dir apps/mobile test

  desktop-native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Tauri Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

  observability-compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
      - name: Validate observability profile
        run: docker compose --env-file .env --profile observability config >/tmp/compose-observability.yml
      - name: Assert collector and dashboard wiring
        run: |
          grep -q 'otel-collector' /tmp/compose-observability.yml
          grep -q 'grafana' /tmp/compose-observability.yml
          test -f infra/observability/otel-collector.yml
          test -f infra/observability/grafana/dashboards/control-plane.json
