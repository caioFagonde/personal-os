name: phase10-connectors-continuity

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  connector-service-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install connector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/connector-service/requirements.txt pytest pytest-cov
      - name: Unit tests and coverage
        working-directory: services/connector-service
        env:
          PYTHONPATH: .
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcd=
        run: python -m pytest tests -q --cov=app.oauth --cov=app.providers --cov=app.backup --cov-branch --cov-fail-under=96

  scaffold-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scaffold tests
        run: python -m pytest tests/test_phase10_scaffold.py -q

  compose-connectors-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
      - name: Validate connectors profile
        run: |
          docker compose --env-file .env --profile connectors --profile core config >/tmp/compose-connectors.yml
          grep -q personal-os-connector-service /tmp/compose-connectors.yml
          grep -q personal-os-postgres /tmp/compose-connectors.yml

  web-onboarding-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web route contract
        run: |
          grep -q "ConnectorsPage" apps/web/src/router/routes.ts
          grep -q "/onboarding" apps/web/src/router/routes.ts
          grep -q "connectorsUrl" apps/web/src/services/api.ts
