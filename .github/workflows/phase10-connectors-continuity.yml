name: Phase 10 Connectors Continuity

on:
  push:
    branches: [main]
    paths:
      - 'services/connector-service/**'
      - 'tests/test_phase10_scaffold.py'
      - 'tests/test_obsidian_notion_trello_connectors.py'
  pull_request:
    paths:
      - 'services/connector-service/**'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  connector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install pytest pytest-asyncio anyio pyyaml
          pip install -r services/connector-service/requirements.txt
      - name: Connector service unit tests
        run: cd services/connector-service && python -m pytest tests -q
      - name: Phase 10 scaffold and marketplace contracts
        run: python -m pytest tests/test_phase10_scaffold.py tests/test_obsidian_notion_trello_connectors.py tests/test_connector_marketplace.py -q
