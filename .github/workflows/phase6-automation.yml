name: Phase 6 Automation

on:
  push:
    branches: [main]
    paths:
      - 'services/automation-service/**'
      - 'modules/automation/**'
      - 'infra/postgres/migrations/005_phase_6_automation.sql'
      - 'tests/test_phase6_scaffold.py'
  pull_request:
    paths:
      - 'services/automation-service/**'
      - 'modules/automation/**'
      - 'tests/test_phase6_scaffold.py'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  automation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest pytest-asyncio pyyaml -r services/automation-service/requirements.txt
      - name: Automation service unit tests
        run: cd services/automation-service && python -m pytest tests -q
      - name: Phase 6 scaffold contract
        run: python -m pytest tests/test_phase6_scaffold.py -q
