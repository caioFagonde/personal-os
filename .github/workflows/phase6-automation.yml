name: Phase 6 Automation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    paths:
      - 'services/automation-service/**'
      - 'infra/postgres/migrations/005_phase_6_automation.sql'
      - 'modules/automation/**'
      - 'apps/web/src/pages/AutomationPage.vue'
      - 'apps/web/src/services/api.ts'
      - '.github/workflows/phase6-automation.yml'
  pull_request:
    paths:
      - 'services/automation-service/**'
      - 'infra/postgres/migrations/005_phase_6_automation.sql'
      - 'modules/automation/**'
      - 'apps/web/src/pages/AutomationPage.vue'
      - 'apps/web/src/services/api.ts'
      - '.github/workflows/phase6-automation.yml'

jobs:
  automation-unit-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/automation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: >-
          python -m pytest tests -q
          --cov=app.dag
          --cov=app.policy
          --cov=app.executor
          --cov=app.scheduler
          --cov=app.n8n_bridge
          --cov=app.notifications
          --cov-branch
          --cov-fail-under=96

  automation-compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: python3 scripts/generate-env.py .env
      - run: docker compose --env-file .env --profile automation config >/tmp/compose-automation.yml
      - run: grep -q personal-os-automation-service /tmp/compose-automation.yml

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
      - name: Start project Postgres image
        run: docker compose --env-file .env --profile core up -d --build postgres
      - name: Apply migrations
        run: |
          for i in {1..60}; do docker compose --env-file .env exec -T postgres pg_isready -U personal_os -d personal_os && break; sleep 2; done
          for migration in infra/postgres/migrations/*.sql; do docker compose --env-file .env exec -T postgres psql -U personal_os -d personal_os -v ON_ERROR_STOP=1 < "$migration"; done
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env --profile core down -v || true
