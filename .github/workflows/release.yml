name: Release Artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  web-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build SPA
        run: pnpm --dir apps/web exec quasar build
      - uses: actions/upload-artifact@v4
        with:
          name: web-spa
          path: apps/web/dist/spa

  android-debug-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --dir apps/web exec quasar build
      - name: Capacitor sync and debug APK
        run: |
          cd apps/mobile
          npx cap sync android || echo "android platform not committed; preflight only"
          node scripts/preflight.mjs

  desktop-tauri-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tauri build (unsigned)
        run: pnpm --dir apps/desktop exec tauri build || cd apps/desktop/src-tauri && cargo build --release
