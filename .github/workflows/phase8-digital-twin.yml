name: phase8-digital-twin

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  digital-twin-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install digital twin dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/digital-twin-service/requirements.txt pytest pytest-cov
      - name: Run Phase 8 coverage gates
        run: |
          cd services/digital-twin-service
          PYTHONPATH=. python -m pytest tests -q \
            --cov=app.ontology --cov=app.privacy --cov=app.timeline --cov=app.recommender --cov=app.evaluation \
            --cov-branch --cov-fail-under=96

  scaffold-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Verify Phase 8 scaffold contracts
        run: python -m pytest tests/test_phase8_scaffold.py -q

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
      - name: Validate AI profile includes digital twin
        run: |
          docker compose --env-file .env --profile ai config >/tmp/compose-ai.yml
          grep -q 'digital-twin-service' /tmp/compose-ai.yml
          grep -q 'personal-os-digital-twin-service' /tmp/compose-ai.yml

  web-digital-twin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile=false
      - name: Run web tests and assert digital twin route
        run: |
          grep -q '/digital-twin' apps/web/src/router/routes.ts
          grep -q 'digitalTwinUrl' apps/web/src/services/api.ts
          pnpm --dir apps/web test -- --coverage
