name: Phase 8 Digital Twin

on:
  push:
    branches: [main]
    paths:
      - 'services/digital-twin-service/**'
      - 'modules/digital-twin/**'
      - 'tests/test_phase8_scaffold.py'
  pull_request:
    paths:
      - 'services/digital-twin-service/**'
      - 'tests/test_phase8_scaffold.py'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  digital-twin-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest pytest-asyncio pytest-cov -r services/digital-twin-service/requirements.txt
      - name: Digital twin tests with coverage
        run: cd services/digital-twin-service && python -m pytest tests -q --cov=app --cov-report=term-missing

  scaffold-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest pyyaml
      - name: Phase 8 scaffold contract
        run: python -m pytest tests/test_phase8_scaffold.py -q

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config validates with digital twin service
        run: |
          cp .env.example .env
          python3 scripts/generate-env.py .env
          docker compose config -q

  web-digital-twin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Digital twin page exists and is routed
        run: |
          test -f apps/web/src/pages/DigitalTwinPage.vue
          grep -q "DigitalTwinPage" apps/web/src/router/routes.ts
