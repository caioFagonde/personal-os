global:
  scrape_interval: 15s
scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: sync-engine
    static_configs:
      - targets: ['sync-engine:8081']
  - job_name: command-bus
    static_configs:
      - targets: ['command-bus:8082']
  - job_name: automation-service
    static_configs:
      - targets: ['automation-service:8085']
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:9464']
  - job_name: nats
    metrics_path: /varz
    static_configs:
      - targets: ['nats:8222']
