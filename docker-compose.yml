name: ${COMPOSE_PROJECT_NAME:-personal_os}

x-restart: &restart
  restart: unless-stopped

x-health-interval: &health
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

networks:
  personal_os_net:
    name: personal_os_net
    driver: bridge

volumes:
  postgres_data:
  nats_data:
  minio_data:
  qdrant_data:
  ollama_data:
  ntfy_data:
  grafana_data:
  prometheus_data:
  loki_data:
  otel_data:
  tailscale_state:
  n8n_data:

services:
  postgres:
    build:
      context: ./infra/postgres
    container_name: personal-os-postgres
    profiles: ["core", "apps", "ai", "maps", "automation", "research", "observability", "connectors", "full"]
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_os}
      POSTGRES_USER: ${POSTGRES_USER:-personal_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *health
    networks: [personal_os_net]

  nats:
    image: nats:2.10-alpine
    container_name: personal-os-nats
    profiles: ["core", "apps", "ai", "automation", "research", "connectors", "full"]
    <<: *restart
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      <<: *health
    networks: [personal_os_net]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: personal-os-minio
    profiles: ["core", "apps", "ai", "research", "connectors", "full"]
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      <<: *health
    networks: [personal_os_net]

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: personal-os-api-gateway
    profiles: ["core", "apps", "full"]
    <<: *restart
    env_file: .env
    environment:
      MODULES_DIR: /workspace/modules
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SYNC_ENGINE_URL: http://sync-engine:8081
      MODULE_SERVICE_URL: http://module-service:8083
      COMMAND_BUS_URL: http://command-bus:8082
      RESEARCH_SERVICE_URL: http://research-service:8084
      AUTOMATION_SERVICE_URL: http://automation-service:8085
      DIGITAL_TWIN_SERVICE_URL: http://digital-twin-service:8086
      CAPTURE_SERVICE_URL: http://capture-service:8087
      STUDY_COMPANION_SERVICE_URL: http://study-companion-service:8088
      CONNECTOR_SERVICE_URL: http://connector-service:8094
      MODEL_RUNTIME_SERVICE_URL: http://model-runtime:8095
      CODING_AGENT_SERVICE_URL: http://coding-agent-service:8096
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./modules:/workspace/modules:ro
      - ./packages/module-manifest:/workspace/packages/module-manifest:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      <<: *health
    networks: [personal_os_net]

  sync-engine:
    build:
      context: ./services/sync-engine
    container_name: personal-os-sync-engine
    profiles: ["core", "apps", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-artifacts}
    ports:
      - "${SYNC_ENGINE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      <<: *health
    networks: [personal_os_net]

  command-bus:
    build:
      context: ./services/command-bus
    container_name: personal-os-command-bus
    profiles: ["core", "automation", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    ports:
      - "${COMMAND_BUS_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      <<: *health
    networks: [personal_os_net]

  automation-service:
    build:
      context: ./services/automation-service
    container_name: personal-os-automation-service
    profiles: ["automation", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://ntfy:80}
      COMMAND_BUS_URL: http://command-bus:8082
      MODULE_SERVICE_URL: http://module-service:8083
    ports:
      - "${AUTOMATION_SERVICE_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      <<: *health
    networks: [personal_os_net]

  module-service:
    build:
      context: ./services/module-service
    container_name: personal-os-module-service
    profiles: ["core", "apps", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    ports:
      - "${MODULE_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      <<: *health
    networks: [personal_os_net]


  digital-twin-service:
    build:
      context: ./services/digital-twin-service
    container_name: personal-os-digital-twin-service
    profiles: ["ai", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    ports:
      - "${DIGITAL_TWIN_SERVICE_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      <<: *health
    networks: [personal_os_net]

  research-service:
    build:
      context: ./services/research-service
    container_name: personal-os-research-service
    profiles: ["research", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      RESEARCH_CACHE_DIR: /data/research/pdf-cache
      RESEARCH_FETCH_MAX_BYTES: ${RESEARCH_FETCH_MAX_BYTES:-52428800}
      FORBIDDEN_SOURCE_HOST_PATTERNS: ${FORBIDDEN_SOURCE_HOST_PATTERNS:-libgen,library genesis,z-library,zlibrary,z-lib,sci-hub,annas-archive,annasarchive}
    ports:
      - "${RESEARCH_SERVICE_PORT:-8084}:8084"
    volumes:
      - ./data/research:/data/research
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      <<: *health
    networks: [personal_os_net]


  capture-service:
    build:
      context: ./services/capture-service
    container_name: personal-os-capture-service
    profiles: ["automation", "apps", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      SECRETARY_EMAIL: ${SECRETARY_EMAIL:-}
      SECRETARY_WHATSAPP: ${SECRETARY_WHATSAPP:-}
      WHATSAPP_CLOUD_API_BASE_URL: ${WHATSAPP_CLOUD_API_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-cloud_api}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      GMAIL_API_BASE_URL: ${GMAIL_API_BASE_URL:-https://gmail.googleapis.com}
    ports:
      - "${CAPTURE_SERVICE_PORT:-8092}:8087"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      <<: *health
    networks: [personal_os_net]

  study-companion-service:
    build:
      context: ./services/study-companion-service
    container_name: personal-os-study-companion-service
    profiles: ["ai", "research", "apps", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      ANALOG_CAPTURE_MAX_BYTES: ${ANALOG_CAPTURE_MAX_BYTES:-52428800}
      VISION_PROVIDER: ${VISION_PROVIDER:-heuristic}
      OCR_PROVIDER: ${OCR_PROVIDER:-heuristic}
      RESEARCH_SERVICE_URL: http://research-service:8084
      MODULE_SERVICE_URL: http://module-service:8083
    ports:
      - "${STUDY_COMPANION_SERVICE_PORT:-8093}:8088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      <<: *health
    networks: [personal_os_net]

  connector-service:
    build:
      context: ./services/connector-service
    container_name: personal-os-connector-service
    profiles: ["connectors", "apps", "automation", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      CONNECTOR_PUBLIC_BASE_URL: ${CONNECTOR_PUBLIC_BASE_URL:-http://localhost:8080}
      CONNECTOR_INTERNAL_BASE_URL: http://connector-service:8094
      BACKUP_DIR: /workspace/backups
      SEND_CONNECTOR_TESTS: ${SEND_CONNECTOR_TESTS:-false}
      OUTBOX_DRAIN_LIMIT: ${OUTBOX_DRAIN_LIMIT:-25}
      CONNECTOR_WORKER_ENABLED: ${CONNECTOR_WORKER_ENABLED:-true}
      CONNECTOR_WORKER_EXECUTE: ${CONNECTOR_WORKER_EXECUTE:-false}
      CONNECTOR_WORKER_INTERVAL_SECONDS: ${CONNECTOR_WORKER_INTERVAL_SECONDS:-20}
      REMOTE_BACKUP_PROVIDER: ${REMOTE_BACKUP_PROVIDER:-google}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/proxy/connectors/api/connectors/google/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/api/proxy/connectors/api/connectors/microsoft/callback}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      SECRETARY_WHATSAPP: ${SECRETARY_WHATSAPP:-}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://ntfy:80}
      NTFY_TOPIC: ${NTFY_TOPIC:-personal-os-dev}
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-personal-os-dev}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      TOKEN_ENCRYPTION_KEY_VERSION: ${TOKEN_ENCRYPTION_KEY_VERSION:-local-v1}
    ports:
      - "${CONNECTOR_SERVICE_PORT:-8094}:8094"
    volumes:
      - ./:/workspace:ro
      - ./backups:/workspace/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      <<: *health
    networks: [personal_os_net]


  model-runtime:
    build:
      context: ./services/model-runtime
    container_name: personal-os-model-runtime
    profiles: ["ai", "research", "apps", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OCR_PROVIDER: ${OCR_PROVIDER:-heuristic}
      VISION_PROVIDER: ${VISION_PROVIDER:-heuristic}
      AUDIO_PROVIDER: ${AUDIO_PROVIDER:-heuristic}
      MODEL_RUNTIME_MAX_BYTES: ${MODEL_RUNTIME_MAX_BYTES:-52428800}
    ports:
      - "${MODEL_RUNTIME_SERVICE_PORT:-8095}:8095"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      <<: *health
    networks: [personal_os_net]

  coding-agent-service:
    build:
      context: ./services/coding-agent-service
    container_name: personal-os-coding-agent-service
    profiles: ["automation", "apps", "full"]
    <<: *restart
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      CODING_AGENT_REPO_PATH: ${CODING_AGENT_REPO_PATH:-/workspace}
      CODING_AGENT_ALLOWED_REPO_ROOTS: ${CODING_AGENT_ALLOWED_REPO_ROOTS:-/workspace}
      CODING_AGENT_WORKTREE_ROOT: ${CODING_AGENT_WORKTREE_ROOT:-/workspace/.agent-worktrees}
      CODING_AGENT_EXECUTE: ${CODING_AGENT_EXECUTE:-false}
      CLAUDE_CODE_COMMAND: ${CLAUDE_CODE_COMMAND:-claude}
    volumes:
      - .:/workspace
      - ./workspace/agent-worktrees:/workspace/.agent-worktrees
    ports:
      - "${CODING_AGENT_SERVICE_PORT:-8096}:8096"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      <<: *health
    networks: [personal_os_net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: personal-os-web
    profiles: ["apps", "full"]
    <<: *restart
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_SYNC_URL: ${VITE_SYNC_URL:-http://localhost:8081}
      VITE_COMMAND_BUS_URL: ${VITE_COMMAND_BUS_URL:-http://localhost:8082}
      VITE_MODULE_API_URL: ${VITE_MODULE_API_URL:-http://localhost:8080/api/proxy/modules}
      VITE_RESEARCH_URL: ${VITE_RESEARCH_URL:-http://localhost:8080/api/proxy/research}
      VITE_AUTOMATION_URL: ${VITE_AUTOMATION_URL:-http://localhost:8080/api/proxy/automation}
      VITE_DIGITAL_TWIN_URL: ${VITE_DIGITAL_TWIN_URL:-http://localhost:8080/api/proxy/digital-twin}
      VITE_CAPTURE_URL: ${VITE_CAPTURE_URL:-http://localhost:8080/api/proxy/capture}
      VITE_STUDY_COMPANION_URL: ${VITE_STUDY_COMPANION_URL:-http://localhost:8080/api/proxy/study-companion}
      VITE_CONNECTORS_URL: ${VITE_CONNECTORS_URL:-http://localhost:8080/api/proxy/connectors}
      VITE_MODEL_RUNTIME_URL: ${VITE_MODEL_RUNTIME_URL:-http://localhost:8080/api/proxy/model-runtime}
      VITE_CODING_AGENT_URL: ${VITE_CODING_AGENT_URL:-http://localhost:8080/api/proxy/coding-agent}
    ports:
      - "${WEB_PORT:-9000}:9000"
    depends_on:
      api-gateway:
        condition: service_healthy
      sync-engine:
        condition: service_healthy
      module-service:
        condition: service_healthy
    networks: [personal_os_net]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: personal-os-qdrant
    profiles: ["ai", "research", "full"]
    <<: *restart
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # The upstream image has changed its available shell utilities across tags.
    # Do not gate the whole full-stack boot on an in-container curl/wget check.
    # Runtime readiness is validated by scripts/doctor-qdrant.sh and service-level retries.
    networks: [personal_os_net]

  ollama:
    image: ollama/ollama:0.4.2
    container_name: personal-os-ollama
    profiles: ["ai", "full"]
    <<: *restart
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [personal_os_net]

  embeddings:
    build:
      context: ./services/embeddings
    container_name: personal-os-embeddings
    profiles: ["ai", "research", "full"]
    <<: *restart
    env_file: .env
    ports:
      - "8090:8090"
    depends_on:
      qdrant:
        condition: service_started
    networks: [personal_os_net]

  tileserver:
    image: maptiler/tileserver-gl:v5.0.0
    container_name: personal-os-tileserver
    profiles: ["maps", "full"]
    <<: *restart
    ports:
      - "8088:8080"
    volumes:
      - ./data/maps:/data
    networks: [personal_os_net]

  n8n:
    image: n8nio/n8n:1.67.1
    container_name: personal-os-n8n
    profiles: ["automation", "full"]
    <<: *restart
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-personal_os}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-personal_os}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_TABLE_PREFIX: n8n_
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [personal_os_net]

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: personal-os-ntfy
    profiles: ["automation", "notifications", "full"]
    <<: *restart
    command: serve
    ports:
      - "8089:80"
    volumes:
      - ntfy_data:/var/cache/ntfy
    networks: [personal_os_net]

  searxng:
    image: searxng/searxng:latest
    container_name: personal-os-searxng
    profiles: ["research", "full"]
    <<: *restart
    ports:
      - "8087:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be set}
    volumes:
      - ./infra/searxng:/etc/searxng
    networks: [personal_os_net]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: personal-os-prometheus
    profiles: ["observability", "full"]
    <<: *restart
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [personal_os_net]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: personal-os-grafana
    profiles: ["observability", "full"]
    <<: *restart
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [personal_os_net]

  loki:
    image: grafana/loki:3.2.1
    container_name: personal-os-loki
    profiles: ["observability", "full"]
    <<: *restart
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks: [personal_os_net]


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: personal-os-otel-collector
    profiles: ["observability", "full"]
    <<: *restart
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otel-collector.yml:ro
      - otel_data:/data
    networks: [personal_os_net]

  tailscale:
    image: tailscale/tailscale:v1.76.1
    container_name: personal-os-tailscale
    profiles: ["mesh", "full"]
    <<: *restart
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-personal-os-dev}
      TS_STATE_DIR: ${TAILSCALE_STATE_DIR:-/var/lib/tailscale}
      TS_EXTRA_ARGS: --accept-routes=false
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
