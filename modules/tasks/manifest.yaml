id: tasks
name: Task Inbox
version: 0.9.0
description: First-class task inbox, delegated work, follow-up tracking, and task history.
routes:
  web: /tasks
  api: /api/tasks
permissions:
  - tasks.read
  - tasks.write
  - contacts.read
  - notifications.send
events:
  publishes:
    - task.created
    - task.updated
    - task.delegated
    - task.completed
  subscribes:
    - capture.created
    - note.created
    - message.acknowledged
storage:
  tables:
    - tasks
    - task_events
    - contacts
    - contact_channels
sync:
  enabled: true
  strategy: local-first
